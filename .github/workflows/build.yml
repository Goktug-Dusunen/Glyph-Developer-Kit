name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Copy Glyph SDK to libs
        run: |
          mkdir -p DeliveryGlyph/app/libs
          cp sdk/glyph-matrix-sdk-2.0.aar DeliveryGlyph/app/libs/

      - name: Make gradlew executable
        run: chmod +x DeliveryGlyph/gradlew 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: DeliveryGlyph
        run: gradle assembleDebug --no-daemon

      - name: Verify APK exists
        run: ls -lh DeliveryGlyph/app/build/outputs/apk/debug/

      - name: Rename APK
        run: |
          cp DeliveryGlyph/app/build/outputs/apk/debug/app-debug.apk \
             DeliveryGlyph/app/build/outputs/apk/debug/DeliveryGlyph-${{ github.ref_name }}.apk 2>/dev/null || \
          cp DeliveryGlyph/app/build/outputs/apk/debug/app-debug.apk \
             DeliveryGlyph/app/build/outputs/apk/debug/DeliveryGlyph-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryGlyph-debug
          path: DeliveryGlyph/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            "DeliveryGlyph/app/build/outputs/apk/debug/app-debug.apk#DeliveryGlyph-${{ github.ref_name }}.apk" \
            --repo ${{ github.repository }} \
            --title "Delivery Glyph ${{ github.ref_name }}" \
            --notes "APK dosyasını indirip Nothing telefonuna yükleyebilirsin." \
            --latest 2>/dev/null || \
          gh release upload ${{ github.ref_name }} \
            "DeliveryGlyph/app/build/outputs/apk/debug/app-debug.apk#DeliveryGlyph-${{ github.ref_name }}.apk" \
            --repo ${{ github.repository }} \
            --clobber
